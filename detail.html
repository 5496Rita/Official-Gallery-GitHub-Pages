  <script>
    // v65: repair legacy/variant album slugs before detail.js resolves the work.
    // The live albums-lite.js may expose `albums` as a global lexical binding,
    // so do not rely only on window.albums.
    (function(){
      var list = (typeof albums !== "undefined" && Array.isArray(albums))
        ? albums
        : (Array.isArray(window.albums) ? window.albums : null);
      if (!list) return;
      window.albums = list;

      var params = new URLSearchParams(location.search);
      var raw = (params.get("id") || "").trim();
      if (!raw) return;

      var aliases = {
        "cathedral-masks": "cathedral-of-masks",
        "cathedral-mask": "cathedral-of-masks",
        "cathedral_of_masks": "cathedral-of-masks",
        "cathedralofmasks": "cathedral-of-masks"
      };
      function norm(v){ return String(v || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, ""); }

      var exact = list.find(function(a){ return a && a.id === raw; });
      if (exact) return;

      var wanted = aliases[raw] || raw;
      var n = norm(wanted);
      var hit = list.find(function(a){
        return a && (norm(a.id) === n || norm(a.title) === n || norm(a.reading) === n);
      });

      // Extra recovery for old Cathedral of Masks links whose slug changed.
      if (!hit && n === "cathedralofmasks") {
        hit = list.find(function(a){ return a && norm(a.title) === "cathedralofmasks"; });
      }

      if (hit && hit.id) {
        params.set("id", hit.id);
        history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash);
      }
    })();
  </script>

  <script>
    // v78: register chapter times now, but expose the full-album URL only after release.
    // Add ?preview=1 to a detail URL for manual pre-release playback checks.
    (function(){
      window.ALBUM_CHAPTERS = window.ALBUM_CHAPTERS || {};
      Object.assign(window.ALBUM_CHAPTERS, {
        "vanishing-reverie": ["0:00","4:32","9:00","13:53","18:02","22:51"],
        "schattenblute": ["0:00","4:26","8:54","13:26","18:14","23:03"],
        "celestial-diamond": ["0:00","4:34","9:02","14:11","18:28","22:59"],
        "persona": ["0:00","4:47","9:49","14:37","18:58","22:17"],
        "zwischenraum": ["0:00","4:51","9:25","13:48","18:17","22:50"]
      });

      var scheduled = {
        "vanishing-reverie": { release: "2026-12-11T00:00:00+09:00", url: "https://youtu.be/q_C02-MrSjw" },
        "schattenblute": { release: "2026-11-21T00:00:00+09:00", url: "https://youtu.be/RDjMWx9Pask" },
        "celestial-diamond": { release: "2026-12-25T00:00:00+09:00", url: "https://youtu.be/8OXg2MfkUyY" },
        "persona": { release: "2026-11-27T00:00:00+09:00", url: "https://youtu.be/1q9yVY_K9Ns" },
        "zwischenraum": { release: "2026-12-18T00:00:00+09:00", url: "https://youtu.be/bE89h0dafXE" }
      };

      window.ALBUM_SCHEDULED_VIDEOS = Object.assign(window.ALBUM_SCHEDULED_VIDEOS || {}, scheduled);
      window.ALBUM_FULL_ALBUMS = window.ALBUM_FULL_ALBUMS || {};

      var now = Date.now();
      var previewMode = new URLSearchParams(location.search).get("preview") === "1";
      window.GALLERY_PREVIEW_MODE = previewMode;
      Object.keys(scheduled).forEach(function(id){
        if (previewMode || now >= new Date(scheduled[id].release).getTime()) {
          window.ALBUM_FULL_ALBUMS[id] = scheduled[id].url;
        } else {
          // Remove only this v77 scheduled mapping if an older patch exposed it early.
          if (window.ALBUM_FULL_ALBUMS[id] === scheduled[id].url) delete window.ALBUM_FULL_ALBUMS[id];
        }
      });
    })();
  </script>

  <script>
    // v70: render a concise album theme before the story.
    (function(){
      function renderTheme(){
        var el = document.getElementById("work-theme");
        if (!el) return;
        var list = (typeof albums !== "undefined" && Array.isArray(albums))
          ? albums
          : (Array.isArray(window.albums) ? window.albums : []);
        var id = new URLSearchParams(location.search).get("id");
        var album = list.find(function(a){ return a && a.id === id; });
        if (!album || !album.theme) { el.hidden = true; return; }
        el.textContent = album.theme;
        el.hidden = false;
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", renderTheme, { once: true });
      } else {
        renderTheme();
      }
    })();
  </script>

  <script>
    // v68: show a subtle internal-style video status in the WATCH FULL ALBUM frame.
    // Status is inferred from the actual full-album URL, so it updates automatically
    // when a YouTube source is added to album data / ALBUM_FULL_ALBUMS.
    (function(){
      function getAlbumList(){
        if (typeof albums !== "undefined" && Array.isArray(albums)) return albums;
        if (Array.isArray(window.albums)) return window.albums;
        return [];
      }
      function hasFullAlbumVideo(id, album){
        var mapped = window.ALBUM_FULL_ALBUMS && window.ALBUM_FULL_ALBUMS[id];
        var scheduled = window.ALBUM_SCHEDULED_VIDEOS && window.ALBUM_SCHEDULED_VIDEOS[id] && window.ALBUM_SCHEDULED_VIDEOS[id].url;
        var direct = album && album.youtubeId;
        var linked = album && album.links && album.links.youtube;
        return !!String(mapped || scheduled || direct || linked || "").trim();
      }
      function releaseLocked(id){
        if (window.GALLERY_PREVIEW_MODE) return false;
        var item = window.ALBUM_SCHEDULED_VIDEOS && window.ALBUM_SCHEDULED_VIDEOS[id];
        return !!(item && Date.now() < new Date(item.release).getTime());
      }
      function applyVideoStatus(){
        var frame = document.getElementById("work-xfd");
        if (!frame) return;

        var id = new URLSearchParams(location.search).get("id") || "";
        var list = getAlbumList();
        var album = list.find(function(a){ return a && a.id === id; }) || null;
        var uploaded = hasFullAlbumVideo(id, album);
        var locked = releaseLocked(id);

        frame.querySelectorAll(".video-status-marker, .release-lock-marker, .preview-mode-marker").forEach(function(n){ n.remove(); });
        frame.classList.toggle("video-not-uploaded", !uploaded);
        frame.classList.toggle("release-locked", locked);

        var marker = document.createElement("span");
        marker.className = "video-status-marker";
        marker.textContent = 'videoStatus: "' + (uploaded ? 'uploaded' : 'not-uploaded') + '"';
        marker.setAttribute("aria-hidden", "true");
        frame.appendChild(marker);

        if (window.GALLERY_PREVIEW_MODE) {
          var preview = document.createElement("span");
          preview.className = "preview-mode-marker";
          preview.textContent = "previewMode: true";
          preview.setAttribute("aria-hidden", "true");
          frame.appendChild(preview);
        }

        if (locked) {
          var item = window.ALBUM_SCHEDULED_VIDEOS[id];
          var date = item.release.slice(0,10).replace(/-/g,'.');
          var lock = document.createElement("span");
          lock.className = "release-lock-marker";
          lock.textContent = 'releaseLocked: true · ' + date;
          lock.setAttribute("aria-hidden", "true");
          frame.appendChild(lock);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function(){ requestAnimationFrame(applyVideoStatus); }, {once:true});
      } else {
        requestAnimationFrame(applyVideoStatus);
      }
    })();
  </script>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08030d" />
  <meta id="meta-description" name="description" content="越黒リタ Official Galleryの作品詳細ページです。" />
  <meta name="author" content="越黒リタ" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta property="og:type" content="music.album" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:site_name" content="越黒リタ Official Gallery" />
  <meta id="og-title" property="og:title" content="作品詳細 — 越黒リタ Official Gallery" />
  <meta id="og-description" property="og:description" content="越黒リタの音楽作品を紹介します。" />
  <meta id="og-image" property="og:image" content="icons/icon-512.png" data-relative-url />
  <meta id="og-url" property="og:url" content="__SITE_URL__/detail.html" data-site-url />
  <meta name="twitter:card" content="summary_large_image" />
  <meta id="twitter-title" name="twitter:title" content="作品詳細 — 越黒リタ Official Gallery" />
  <meta id="twitter-description" name="twitter:description" content="越黒リタの音楽作品を紹介します。" />
  <meta id="twitter-image" name="twitter:image" content="icons/icon-512.png" data-relative-url />
  <link id="canonical-url" rel="canonical" href="__SITE_URL__/detail.html" data-site-url />
  <title>Work Detail — 越黒リタ Official Gallery</title>
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="style.css?v=400" />
  <link rel="stylesheet" href="v2.css?v=400" />
</head>

<body class="detail-page page-enter">
  <div class="page-transition" aria-hidden="true"></div>
  <a class="skip-link" href="#detail-main">メインコンテンツへ移動</a>

  <div class="detail-atmosphere" aria-hidden="true">
    <div class="detail-moon"></div>
    <span class="detail-rose detail-rose--1">✦</span>
    <span class="detail-rose detail-rose--2">❦</span>
    <span class="detail-rose detail-rose--3">✦</span>
    <span class="detail-rose detail-rose--4">❧</span>
    <span class="detail-rose detail-rose--5">✦</span>
  </div>

  <header class="site-header detail-header">
    <a href="index.html#home" class="brand" aria-label="Home">
      <img src="icons/brand-mark.png" alt="" width="64" height="64" />
      <span>
        越黒リタ<br>
        <small>OFFICIAL GALLERY</small>
      </span>
    </a>

    <nav id="site-nav" class="site-nav" aria-label="Primary">
  <a href="index.html#home">ENTRANCE</a>
  <a href="index.html#exhibition">GALLERY</a>
  <a href="index.html#archive">DISCOGRAPHY</a>
</nav>
  </header>

  <main>
  <section id="detail-main" class="work-detail" hidden>
    <a class="detail-back" href="index.html#archive">
      ← BACK TO DISCOGRAPHY
    </a>

    <section class="work-hero">
      <div class="work-hero__cover reveal is-visible">
        <div class="work-cover-frame">
          <span class="work-cover-frame__corner work-cover-frame__corner--tl" aria-hidden="true"></span>
          <span class="work-cover-frame__corner work-cover-frame__corner--tr" aria-hidden="true"></span>
          <span class="work-cover-frame__corner work-cover-frame__corner--bl" aria-hidden="true"></span>
          <span class="work-cover-frame__corner work-cover-frame__corner--br" aria-hidden="true"></span>
          <img id="work-cover" alt="" width="1200" height="1200" decoding="async" />
        </div>
      </div>

      <div class="work-hero__copy reveal is-visible">
        <p id="work-kicker" class="eyebrow"></p>
        <h1 id="work-title"></h1>
        <p id="work-release" class="work-release"></p>

        <div class="listen-now" aria-labelledby="listen-now-title">
          <div class="ornament-title ornament-title--listen">
            <span></span>
            <p id="listen-now-title" class="listen-now__title">
              LISTEN NOW
            </p>
            <span></span>
          </div>

          <div id="work-links" class="listen-now__links"></div>
        </div>
      </div>
    </section>

    <section class="work-content">
      <div class="work-section work-tracks">
        <div class="ornament-title">
          <span></span>
          <h2>TRACK LIST</h2>
          <span></span>
        </div>

        <ol id="work-tracks" class="detail-track-list"></ol>
      </div>

      <div class="work-section work-xfd">
        <div class="ornament-title">
          <span></span>
          <h2>XFD</h2>
          <span></span>
        </div>

        <div id="work-xfd" class="xfd-frame"></div>
      </div>
    </section>

    <nav class="work-pagination" aria-label="Work navigation">
      <a id="work-prev" href="#">
        <small>PREVIOUS</small>
        <span></span>
      </a>

      <a id="work-next" href="#">
        <small>NEXT</small>
        <span></span>
      </a>
    </nav>
  </section>

  <section id="detail-not-found" class="detail-not-found" hidden>
    <p class="eyebrow">NOT FOUND</p>
    <h1>作品が見つかりません。</h1>
    <a class="button" href="index.html#archive">
      BACK TO DISCOGRAPHY
    </a>
  </section>
  </main>

  <footer class="site-footer detail-footer">
    <p>Thank you for visiting my world.</p>
    <a href="index.html#home">HOME</a>
  </footer>

  <script src="site-config.js?v=400"></script>
  <script src="albums.js?v=400"></script>
  <script src="detail.js?v=400"></script>
</body>
</html>

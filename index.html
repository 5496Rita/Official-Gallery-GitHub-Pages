  <style>
    :root{--bg:#08050b;--ink:#f3ecf3;--muted:#bbaabc;--line:rgba(218,183,209,.18);--line2:rgba(235,201,224,.30)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:'Noto Serif JP',serif;overflow-x:hidden;overflow-y:auto;background:#07040b}a{color:inherit}
    .home-header{position:fixed;z-index:30;top:0;left:0;right:0;height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(18px,3vw,44px);border-bottom:1px solid rgba(210,170,201,.12);background:linear-gradient(180deg,rgba(8,4,11,.94),rgba(8,4,11,.48));backdrop-filter:blur(10px)}
    .home-brand{text-decoration:none;display:flex;flex-direction:column;line-height:1;width:max-content}.home-brand span{font-size:18px;letter-spacing:.12em}.home-brand small{font:500 8px/1 'Cormorant Garamond',serif;letter-spacing:.25em;color:#ad9bad;margin-top:6px}.home-status{font:500 9px/1 'Cormorant Garamond',serif;letter-spacing:.28em;color:#9d889b}.home-socials{justify-self:end;display:flex;gap:10px}.home-socials a{text-decoration:none;color:#b7a6b7;font:500 10px/1 'Cormorant Garamond',serif;padding:6px}
    .hero-stage{position:relative;height:100dvh;min-height:700px;padding-top:58px;overflow:hidden;background:#08050b}
    .hero-art{position:absolute;inset:58px 0 0;background:url('assets/hero-main.png') 32% center/cover no-repeat;transform:scale(1.02);transition:opacity .65s ease,transform 8s ease}
    .hero-stage:before{content:'';position:absolute;z-index:1;inset:58px 0 0;background:linear-gradient(90deg,rgba(5,2,8,.08) 0%,rgba(5,2,8,.02) 38%,rgba(5,2,8,.18) 58%,rgba(5,2,8,.74) 82%,rgba(5,2,8,.94) 100%),linear-gradient(180deg,rgba(4,2,7,.02),transparent 45%,rgba(4,2,7,.54) 100%),radial-gradient(circle at 18% 16%,rgba(203,162,255,.20),transparent 16%);pointer-events:none}
    .hero-copy{position:absolute;z-index:4;left:clamp(34px,4.2vw,84px);bottom:clamp(34px,7vh,88px);width:min(620px,45vw);padding:24px 26px 22px;border:1px solid rgba(231,196,221,.15);background:linear-gradient(135deg,rgba(18,9,22,.58),rgba(9,4,13,.20));backdrop-filter:blur(9px);box-shadow:0 18px 60px rgba(0,0,0,.28)}
    .hero-copy:after{content:'';position:absolute;left:24px;right:24px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(219,122,179,.75),transparent);box-shadow:0 0 18px rgba(190,96,154,.5)}
    .hero-eyebrow{margin:0 0 9px;font:500 9px/1 'Cormorant Garamond',serif;letter-spacing:.25em;color:#c0a9bd}.hero-copy h1{margin:0;font:500 clamp(58px,5.2vw,90px)/.94 'Noto Serif JP',serif;letter-spacing:.08em}.hero-tagline{margin:10px 0 0;font:500 clamp(28px,2.45vw,42px)/1.03 'Cormorant Garamond',serif;color:#f0e6f0}.hero-lead{margin:17px 0 0;font-size:12px;line-height:1.9;color:#d6c8d6}.hero-lead:before{content:'';display:block;width:92px;height:1px;margin-bottom:14px;background:linear-gradient(90deg,rgba(211,122,176,.9),transparent);box-shadow:0 0 18px rgba(196,109,164,.35)}
    .film-zone{position:absolute;z-index:5;top:calc(58px + clamp(28px,5vh,56px));right:clamp(28px,3.3vw,62px);width:min(26vw,430px)}
    .short-ambient{position:absolute;inset:-30px;z-index:-2;background-size:cover;background-position:center;filter:blur(30px) saturate(.9) brightness(.38);transform:scale(1.10);opacity:0;transition:opacity .5s ease}.film-zone.has-short .short-ambient{opacity:.48}.film-zone:before{content:'';position:absolute;z-index:-1;inset:-24px;background:radial-gradient(circle at 50% 30%,rgba(151,68,121,.25),transparent 45%),linear-gradient(180deg,rgba(7,3,10,.68),rgba(7,3,10,.32) 50%,rgba(7,3,10,.72));filter:blur(2px)}
    .home-short{opacity:0;transition:opacity .35s}.home-short.is-ready{opacity:1}.short-label{display:flex;align-items:center;gap:12px;margin:0 0 10px;font:500 9px/1 'Cormorant Garamond',serif;letter-spacing:.20em;color:#eadcea}.short-label:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,rgba(221,184,212,.34),transparent)}
    .home-short-frame{position:relative;width:100%;aspect-ratio:9/16;border:1px solid rgba(233,196,223,.25);background:#030204;box-shadow:0 26px 68px rgba(0,0,0,.5),0 0 48px rgba(126,44,95,.16);overflow:hidden}.home-short-frame:before{content:'';position:absolute;inset:-7px;border:1px solid rgba(233,196,223,.10);pointer-events:none}.home-short-player,.home-short-player iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important;display:block!important}.home-short-controls{display:grid;grid-template-columns:58px 1fr;gap:8px;margin-top:10px}.home-short-controls button{height:36px;border:1px solid rgba(218,180,209,.18);background:rgba(15,7,18,.68);color:#d7c6d4;font:500 9px/1 'Cormorant Garamond',serif;letter-spacing:.15em;cursor:pointer}.home-short-controls button:hover{border-color:rgba(236,194,221,.48);background:rgba(55,20,48,.55);color:#fff}
    .menu-band{position:relative;z-index:8;background:linear-gradient(180deg,#0a0610,#07040b);border-top:1px solid rgba(220,183,211,.15);padding:18px clamp(28px,3.3vw,62px) 28px}
    .home-portals{width:min(100%,1180px);margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.home-portals a{position:relative;min-height:92px;padding:13px 15px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(25,14,31,.70),rgba(11,6,14,.84));text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:.22s}.home-portals a:hover{transform:translateY(-3px);border-color:var(--line2);background:linear-gradient(145deg,rgba(41,18,43,.78),rgba(12,6,16,.90))}.home-portals a:after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);width:98px;height:64px;opacity:.13;background-repeat:no-repeat;background-position:center;background-size:contain}.home-portals .archive:after{background-image:url('assets/menu/archive.svg')}.home-portals .lyrics:after{background-image:url('assets/menu/lyrics.svg')}.home-portals .exhibition:after{background-image:url('assets/menu/exhibition.svg')}.home-portals .about:after{background-image:url('assets/menu/about.svg')}.home-portals span{font:500 7px/1 'Cormorant Garamond',serif;color:#887387;margin-bottom:auto}.home-portals strong{font:500 16px/1 'Cormorant Garamond',serif;letter-spacing:.11em}.home-portals small{font:500 7px/1.2 'Cormorant Garamond',serif;color:#9b879a;margin-top:5px}
    @media(max-width:1250px){.film-zone{width:min(28vw,360px)}.hero-copy{width:min(560px,47vw)}}
    @media(max-height:800px) and (min-width:1001px){.film-zone{top:84px;width:min(23vw,315px)}.hero-copy{bottom:22px}.home-portals a{min-height:74px}}
    @media(max-width:1000px){body{overflow:auto}.home-status{display:none}.home-header{height:54px}.hero-stage{height:auto;min-height:100vh;padding-top:54px;display:flex;flex-direction:column}.hero-art{position:relative;inset:auto;height:68vh;min-height:540px;background-position:35% center}.hero-stage:before{inset:54px 0 auto;height:68vh;min-height:540px}.hero-copy{position:absolute;top:calc(54px + 68vh - 260px);left:18px;right:18px;bottom:auto;width:auto}.film-zone{position:relative;top:auto;right:auto;width:min(86vw,360px);margin:28px auto 0}.menu-band{padding:16px 18px 28px}.home-portals{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.home-portals{grid-template-columns:1fr}.hero-copy h1{font-size:42px}.hero-tagline{font-size:22px}.hero-copy{top:calc(54px + 68vh - 230px);padding:18px}.film-zone{width:min(88vw,330px)}}
  </style>

name: Update featured Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/shorts.json'

permissions:
  contents: write

concurrency:
  group: update-featured-shorts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_PLAYLIST_ID: PLiJ4i_JuStGC25t-DOW7QXow7CaN32HHV

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch playlist videos
        run: node scripts/update-shorts.js

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/shorts.json; then
            echo "No playlist changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shorts.json
          git commit -m "Update featured Shorts data"
          git push
